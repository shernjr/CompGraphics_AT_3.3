<!DOCTYPE html>
    <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title> Computer Graphics AT3.3 3D_Model </title>
            <link rel="stylesheet" href="styles/style.css">
        </head>
        <body>
            <canvas id="three-canvas"></canvas>

            <div id="scale-controls" style="position: absolute; top: 10px; right: 10px; background: white; padding: 10px; border-radius: 8px; display: none;">
                <h4 id="selected-object-name">Selected: none</h4>
                <label>X Scale: <input type="range" id="scale-x" min="0.1" max="2" step="0.1" value="1"></label><br>
                <label>Y Scale: <input type="range" id="scale-y" min="0.1" max="2" step="0.1" value="1"></label><br>
                <label>Z Scale: <input type="range" id="scale-z" min="0.1" max="2" step="0.1" value="1"></label><br>
            </div>

            <script type="module" src="/src/main.js"></script>

            

        </body>
    </html>
