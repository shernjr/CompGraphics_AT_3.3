<!DOCTYPE html>
    <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title> Computer Graphics AT3.3 3D_Model </title>
            <header>Shift to move object around, Shift + Alt to move up or down</header>
            <link rel="stylesheet" href="styles/style.css">
        </head>
        <body>
            <canvas id="three-canvas"></canvas>

            <div id="scale-controls" style="position: absolute; top: 10px; right: 10px; background: white; padding: 10px; border-radius: 8px; display: none;">
                <h4 id="selected-object-name">Selected: none</h4>
                <label>X Scale: <input type="range" id="scale-x" min="0.05" max="2" step="0.1" value="1"></label><br>
                <label>Y Scale: <input type="range" id="scale-y" min="0.05" max="2" step="0.1" value="1"></label><br>
                <label>Z Scale: <input type="range" id="scale-z" min="0.05" max="2" step="0.1" value="1"></label><br>
            </div>

            <div id="rotate-controls" style="position: absolute; top: 180px; right: 10px; background: white; padding: 10px; border-radius: 8px; display: none;">
                <h4 id="selected-object-rotation-name">Selected: none</h4>
                <label>X Rotation: <input type="range" id="rotate-x" min="0" max="360" step="1" value="0"></label><br>
                <label>Y Rotation: <input type="range" id="rotate-y" min="0" max="360" step="1" value="0"></label><br>
                <label>Z Rotation: <input type="range" id="rotate-z" min="0" max="360" step="1" value="0"></label><br>
            </div>
              

            <script type="module" src="/src/main.js"></script>

            

        </body>
    </html>
